fragment JWHeaderData on JWHeader {
  logo: HeaderLogo {
    ...ReferenceData
  }
  bannerr: HeaderBanner {
    ...ReferenceData
  }
  HomeLink {
    ...LinkData
  }
  topbar: HeaderTopBar {
    ... on JWHeaderTopBar {
      LeftNavigationLinks {
        ...LinkItemData
      }
      SearchIcon {
        ...ReferenceData
      }
      FindAStore {
        ...ReferenceData
      }
    }
  }
  mainNav: HeaderMainNavigation {
    ... on JWMainNavigation {
      Title
      IsTabLayout
      HeaderColumns {
        ... on JWHeaderColumn {
          HeaderColumnTitle
          HeaderColumnSubLinks {
            ...LinkItemData
          }
          HeaderColumnLink {
            ...LinkData
          }
        }
      }
    }
  }
}
